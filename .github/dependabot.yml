version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    labels:
      - skip-release
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 10

  - package-ecosystem: docker-compose
    directory: /docker
    labels:
      - skip-release
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
